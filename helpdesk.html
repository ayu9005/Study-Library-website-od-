<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stru.css">
    <title>Help Center</title>
</head>
<body>
    <div class="container">
        <h1>Hello! Welcome to our helpdesk</h1>
        <p>If you need any help, feel free to ask.</p>
        <button id="helpButton" onclick="showHelpForm()">Drop us your query!</button>
        <li><a href="http://127.0.0.1:5501/index.html">Home</a></li>
        <div class="help-form" id="helpForm">
            <p>
                <div class="form">
                    <form action="https://formspree.io/f/xrgvbved"
                     method="POST">
                           <input type="text" name="name" id="name" placeholder="Enter your name">
                           <input type="text" name="phone" id="phone" placeholder="Enter your phone">
                           <textarea class="form-input" name="text" id="text" cols="30" rows="10" 
                   placeholder="Elloborate your concern" style="width: 85% ;"></textarea>
                           <button class="btn btn-dark">Submit</button>
                       </div>
                   </form>
                   <style>
        .contact{
            background-color: bisque;
            height: 750px;
        }
        .text-center{
            text-align: center;
            font-size: 50px;
            padding-top: 40px;
            text-align: center;
            direction: flex;
            padding: 40px 25px;
            margin: 5px 2px;
        }
        .form{
            max-width: 70%;
            margin: 30px auto;
        }
        .form input{
            margin: 28px;
            padding: 5px 3px;
            width: 85%;
            font-size: 19px;
            border: 2px solid gray;
            border-radius: 6px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-border-radius: 6px;
            -moz-border-radius: 6px;
            -ms-border-radius: 6px;
            -o-border-radius: 6px;
        }
        .text-footer{
        text-align: center;
        padding: 30px 0;
        font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        color: white;
        }
        .textarea{
            margin-right: 15px 4px;
        }
        </style>
    </div>
</form>
            </p>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
